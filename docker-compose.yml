version: '3.8'

services:
  # 1. Flask Application Service
  flask_app:
    build: .
    image: flask_app:latest
    container_name: flask_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/marks_analyser
      - SECRET_KEY=shridevi-production-secure-key-2024
      - FLASK_ENV=production
      - USE_MONGO=true
    depends_on:
      - mongodb
    networks:
      - app_network

  # 2. MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  # 3. Mongo Express Web Management Interface
  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=adminpass
    depends_on:
      - mongodb
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
