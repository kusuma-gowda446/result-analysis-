{% extends 'base.html' %}

{% block title %}User Login{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 50vh;">
    <div class="card" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-lg);">
        <div class="card-header" style="background: var(--primary-navy); color: white; padding: 24px;">
            <div>
                <h2 style="color: white; font-size: 1.4rem;">🔒 Portal Sign In</h2>
                <p style="font-size: 0.85rem; opacity: 0.85; margin-top: 4px;">Internal Assessment & Results System</p>
            </div>
        </div>
        <div class="card-body" style="padding: 32px;">
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter username (e.g. admin or USN)" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px; font-size: 1rem;">
                    Sign In to Portal →
                </button>
            </form>
        </div>
        <div style="background: #f8fafc; padding: 16px 24px; border-top: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-secondary); text-align: center;">
            Default Admin Credentials: <strong>admin</strong> / <strong>admin123</strong>
        </div>
    </div>
</div>
{% endblock %}
