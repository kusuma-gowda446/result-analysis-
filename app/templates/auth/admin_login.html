{% extends "base.html" %}

{% block title %}Faculty & Admin Login — SIET Tumakuru{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4 py-md-5">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="glass-card shadow-lg border-0 overflow-hidden">
            <!-- Glass Header -->
            <div class="glass-header text-center py-4">
                <div class="mb-2">
                    <span class="badge badge-amber px-3 py-2 rounded-pill fs-8 font-monospace">
                        <i class="bi bi-shield-lock-fill me-1"></i> FACULTY &amp; ADMIN PORTAL
                    </span>
                </div>
                <h3 class="fw-bold text-white mb-1 display-font">Administrative Sign In</h3>
                <p class="text-white-50 small mb-0">Secure Portal Access for Academic Staff</p>
            </div>

            <div class="p-4 p-sm-5">
                <form action="{{ url_for('auth.admin_login') }}" method="POST">
                    <div class="form-floating mb-3">
                        <input type="text" id="username" name="username" class="form-control" placeholder="Enter admin username" required autofocus>
                        <label for="username"><i class="bi bi-person-fill text-primary me-1"></i> Username</label>
                    </div>

                    <div class="form-floating mb-4">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
                        <label for="password"><i class="bi bi-lock-fill text-primary me-1"></i> Password</label>
                    </div>

                    <button type="submit" class="btn btn-glass-primary w-100 py-3 fw-bold rounded-pill shadow-sm mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Log In to Admin Dashboard
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top border-secondary-subtle">
                    <a href="{{ url_for('auth.student_login') }}" class="text-decoration-none fw-semibold text-primary">
                        <i class="bi bi-mortarboard-fill me-1"></i> Student Portal Login →
                    </a>
                </div>
            </div>

            <div class="p-3 text-center border-top border-secondary-subtle bg-body-tertiary">
                <div class="badge badge-emerald border-0 mb-0 py-2 px-3 fs-8 text-wrap d-inline-block rounded-pill">
                    <i class="bi bi-key-fill me-1"></i> Default Admin Credentials: <strong class="font-monospace ms-1">admin / admin123</strong>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
