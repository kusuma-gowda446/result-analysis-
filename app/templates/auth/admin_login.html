{% extends "base.html" %}

{% block title %}Admin Login — Shridevi Institute{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="glass-card auth-card">
        <div class="auth-header text-center mb-4">
            <div class="auth-badge">
                <i class="fas fa-shield-alt"></i> Admin Portal
            </div>
            <h2>Faculty & Admin Access</h2>
            <p class="text-muted">Sign in with your administrator credentials</p>
        </div>

        <form action="{{ url_for('auth.admin_login') }}" method="POST">
            <div class="form-group mb-3">
                <label for="username" class="form-label">
                    <i class="fas fa-user text-primary"></i> Username
                </label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter admin username" required autofocus>
            </div>

            <div class="form-group mb-4">
                <label for="password" class="form-label">
                    <i class="fas fa-lock text-primary"></i> Password
                </label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block w-100 py-2">
                <i class="fas fa-sign-in-alt me-2"></i> Log In to Admin Dashboard
            </button>
        </form>
        
        <div class="auth-footer text-center mt-4">
            <a href="{{ url_for('student.dashboard') }}" class="text-muted small">
                <i class="fas fa-graduation-cap me-1"></i> Are you a student? Access Student Portal
            </a>
        </div>
    </div>
</div>
{% endblock %}
