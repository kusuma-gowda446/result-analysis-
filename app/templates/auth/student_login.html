{% extends "base.html" %}

{% block title %}Student Portal Login — SIET Tumakuru{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4 py-md-5">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="glass-card shadow-lg border-0 overflow-hidden">
            <!-- Glass Header -->
            <div class="glass-header text-center py-4">
                <div class="mb-2">
                    <span class="badge badge-amber px-3 py-2 rounded-pill fs-8 font-monospace">
                        <i class="bi bi-mortarboard-fill me-1"></i> STUDENT PORTAL ACCESS
                    </span>
                </div>
                <h3 class="fw-bold text-white mb-1 display-font">Student Login</h3>
                <p class="text-white-50 small mb-0">Enter your University Seat Number (USN)</p>
            </div>

            <div class="p-4 p-sm-5">
                <form action="{{ url_for('auth.student_login') }}" method="POST">
                    <div class="form-floating mb-3">
                        <input type="text" id="usn" name="usn" class="form-control text-uppercase fw-semibold font-monospace" placeholder="e.g. 1SG24CS001" required autofocus style="text-transform: uppercase;">
                        <label for="usn"><i class="bi bi-card-heading text-primary me-1"></i> University Seat Number (USN)</label>
                    </div>

                    <div class="form-floating mb-4">
                        <input type="password" id="password" name="password" class="form-control text-uppercase font-monospace" placeholder="Enter USN as password" required style="text-transform: uppercase;">
                        <label for="password"><i class="bi bi-key text-primary me-1"></i> Password (USN)</label>
                    </div>

                    <button type="submit" class="btn btn-glass-primary w-100 py-3 fw-bold rounded-pill shadow-sm mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Access Student Dashboard
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top border-secondary-subtle">
                    <a href="{{ url_for('auth.admin_login') }}" class="text-decoration-none fw-semibold text-primary">
                        <i class="bi bi-shield-lock-fill me-1"></i> Faculty &amp; Administrator Login →
                    </a>
                </div>
            </div>

            <div class="p-3 text-center border-top border-secondary-subtle bg-body-tertiary">
                <small class="text-muted"><i class="bi bi-info-circle me-1"></i> Login Hint: Use your <strong>USN</strong> for both Username &amp; Password.</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
