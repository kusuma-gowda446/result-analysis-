{% extends "base.html" %}

{% block title %}Student Portal Login — SIET Tumakuru{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4 py-md-5">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <!-- High Contrast Gradient Header -->
            <div class="card-header text-white text-center py-4 border-0" style="background: linear-gradient(135deg, #0A192F 0%, #1E3A8A 100%);">
                <div class="mb-2">
                    <span class="badge bg-warning text-dark px-3 py-2 rounded-pill fs-7 fw-bold">
                        <i class="bi bi-mortarboard-fill me-1"></i> STUDENT PORTAL ACCESS
                    </span>
                </div>
                <h3 class="fw-bold text-white mb-1">Student Login</h3>
                <p class="text-white-50 small mb-0">Enter your University Seat Number (USN)</p>
            </div>

            <div class="card-body p-4 p-sm-5">
                <form action="{{ url_for('auth.student_login') }}" method="POST">
                    <div class="mb-3">
                        <label for="usn" class="form-label fw-bold text-dark-emphasis">
                            <i class="bi bi-card-heading text-primary me-1"></i> University Seat Number (USN)
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-tertiary border-end-0"><i class="bi bi-person-vcard text-muted"></i></span>
                            <input type="text" id="usn" name="usn" class="form-control border-start-0 text-uppercase fw-semibold font-monospace" placeholder="e.g. 1SG24CS001" required autofocus style="text-transform: uppercase;">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold text-dark-emphasis">
                            <i class="bi bi-shield-lock text-primary me-1"></i> Password (USN)
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-tertiary border-end-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" id="password" name="password" class="form-control border-start-0 text-uppercase font-monospace" placeholder="Enter USN as password" required style="text-transform: uppercase;">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-3 shadow-sm mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Access Student Dashboard
                    </button>
                </form>

                <div class="text-center mt-3 pt-3 border-top">
                    <a href="{{ url_for('auth.admin_login') }}" class="text-decoration-none fw-semibold text-primary">
                        <i class="bi bi-shield-lock-fill me-1"></i> Faculty &amp; Administrator Login →
                    </a>
                </div>
            </div>

            <div class="card-footer bg-body-tertiary text-center py-3 border-0">
                <small class="text-muted"><i class="bi bi-info-circle me-1"></i> Login Hint: Use your <strong>USN</strong> for both Username and Password.</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
