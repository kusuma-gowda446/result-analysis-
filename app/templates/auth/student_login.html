{% extends "base.html" %}

{% block title %}Student Login — SIET Tumakuru{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-dark text-white text-center py-4 border-0">
                <div class="mb-2">
                    <span class="badge bg-success px-3 py-2 rounded-pill fs-7 fw-semibold">
                        <i class="bi bi-mortarboard-fill me-1"></i> STUDENT PORTAL ACCESS
                    </span>
                </div>
                <h3 class="fw-bold mb-1">Student Login</h3>
                <p class="text-white-50 small mb-0">Enter USN (Use USN as password)</p>
            </div>

            <div class="card-body p-4 p-sm-5">
                <form action="{{ url_for('auth.student_login') }}" method="POST">
                    <div class="mb-3">
                        <label for="usn" class="form-label fw-medium text-secondary">
                            <i class="bi bi-card-heading text-success me-1"></i> University Seat Number (USN)
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-upc-scan text-muted"></i></span>
                            <input type="text" id="usn" name="usn" class="form-control bg-light border-start-0 text-uppercase fw-semibold" placeholder="e.g. 1SG24CS001" required autofocus style="text-transform: uppercase;">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium text-secondary">
                            <i class="bi bi-shield-lock text-success me-1"></i> Password (USN)
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" id="password" name="password" class="form-control bg-light border-start-0 text-uppercase" placeholder="Enter USN as password" required style="text-transform: uppercase;">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-3 shadow-sm mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Access Student Dashboard
                    </button>
                </form>

                <div class="text-center mt-3 pt-3 border-top">
                    <a href="{{ url_for('auth.admin_login') }}" class="text-decoration-none small text-muted">
                        <i class="bi bi-shield-lock-fill text-primary me-1"></i> Faculty &amp; Administrator Login →
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
